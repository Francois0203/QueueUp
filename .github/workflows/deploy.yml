name: Test & deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run by hand from the Actions tab; tick the box to redeploy the functions even if they did not change.
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Also deploy Cloud Functions'
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, build & test (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator needs Java 21+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (Auth, Firestore & Functions emulators + fake Spotify)
        run: npm test

  deploy:
    name: Deploy to Firebase
    needs: test
    # Only from main (push or manual run), never from pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the next steps can see which files this push changed.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Check the required secrets are set
        env:
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          missing=0
          for k in PROJECT_ID SERVICE_ACCOUNT FIREBASE_API_KEY FIREBASE_APP_ID; do
            if [ -z "${!k}" ]; then echo "::error::Secret ${k/PROJECT_ID/FIREBASE_PROJECT_ID} is empty. Add it under Settings > Secrets and variables > Actions (see README, Deploying)."; missing=1; fi
          done
          exit $missing

      - name: Build
        run: npm run build
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          # Shown on the Terms and Privacy pages (public information, so repository variables).
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_CONTACT: ${{ vars.OPERATOR_CONTACT }}
          OPERATOR_ADDRESS: ${{ vars.OPERATOR_ADDRESS }}
          GOVERNING_LAW: ${{ vars.GOVERNING_LAW }}

      # Functions are deployed only when something under functions/ changed in this push (README
      # edits aside), or when the workflow is run by hand with "Also deploy Cloud Functions" ticked.
      - name: Did the functions change?
        id: functions
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deploy="${{ inputs.deploy_functions }}"
            echo "Run by hand; deploy functions: $deploy"
          elif [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            deploy=true
            echo "Cannot tell what this push changed, so deploying the functions to be safe."
          else
            changed=$(git diff --name-only "$before" "${{ github.sha }}" | grep '^functions/' | grep -v 'README.md$' || true)
            if [ -n "$changed" ]; then deploy=true; echo "Functions changed:"; echo "$changed"; else deploy=false; echo "Functions unchanged; skipping their deploy."; fi
          fi
          echo "deploy=${deploy:-false}" >> "$GITHUB_OUTPUT"

      # SERVICE_ACCOUNT is the JSON key of the deploy robot account (see README, Deploying).
      - name: Authenticate to Google Cloud
        env:
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          # The account's email is not secret, and naming it makes a permissions error easy to fix.
          echo "Deploying as: $(node -e "console.log(require(process.argv[1]).client_email)" "$RUNNER_TEMP/firebase-sa.json")"

      # Order matters: functions first (the site calls them), then rules & indexes, then hosting.
      - name: Deploy Cloud Functions
        if: steps.functions.outputs.deploy == 'true'
        run: |
          # functions/.env is not in git (the repo is public); write it from repository variables.
          : > functions/.env
          [ -n "${{ vars.PUBLIC_URL }}" ] && printf 'PUBLIC_URL=%s\n' "${{ vars.PUBLIC_URL }}" >> functions/.env
          printf 'ENFORCE_APP_CHECK=%s\n' "${{ vars.ENFORCE_APP_CHECK || 'false' }}" >> functions/.env
          # --force also sets up the build-image cleanup policy, so old images don't pile up storage costs.
          npx firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force

      - name: Deploy Firestore rules and indexes
        run: npx firebase deploy --only firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive

      - name: Deploy Hosting
        run: npx firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
